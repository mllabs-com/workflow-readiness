# Four candidate workflows at a fictional mid-size distributor.
# Each person scores alone, before the group meets; the tool flags
# any factor where two scores sit two or more points apart.
# Scores run 1 (weak) to 5 (strong). A missing check counts as unchecked.

[[workflow]]
name = "Supplier invoice matching"
target = "Match 85% of PO-backed invoices with no human touch; every unmatched one reaches a named reviewer within one business day."
notes = "Three-way match runs in the ERP; exceptions live in a shared inbox."

[workflow.checks]
target = true
access = true
owner = true
reachable = true
signal = true
stability = true

[[workflow.scores]]
scorer = "Controller"
impact = 4
data = 4
feasibility = 5
fit = 4

[[workflow.scores]]
scorer = "AP lead"
impact = 5
data = 4
feasibility = 4
fit = 4

[[workflow]]
