[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-readiness"
version = "0.1.0"
description = "Rank candidate workflows for a first AI build: four factors, six checks, one next step."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "ML LABS", email = "contact@mllabs.com" }]
dependencies = []

[project.urls]
Homepage = "https://mllabs.com"
Source = "https://github.com/mllabs-com/workflow-readiness"

[project.scripts]
workflow-readiness = "workflow_readiness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
